[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "retreever"
version = "0.1.0"
description = "Hierarchical Retrieval with Matryoshka Representations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ReTreever Team"}
]
keywords = ["retrieval", "hierarchical", "matryoshka", "representation-learning", "neural-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.10.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "faiss-cpu>=1.7.3",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "einops>=0.6.0",
    "timm>=0.9.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.3"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/retreever"
Documentation = "https://github.com/yourusername/retreever#readme"
Repository = "https://github.com/yourusername/retreever"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=retreever --cov-report=term-missing"
