[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retreever"
version = "0.1.0"
description = "ReTreever: hierarchical tree-based retrieval"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["retreever*"]

[tool.black]
line-length = 99
target-version = ["py310"]
