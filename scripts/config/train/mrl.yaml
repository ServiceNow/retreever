# Training hyperparameters for MRL

# Batch sizes
train_batch_size: 64
test_batch_size: 64

# Optimization
learning_rate: 0.0004
lr_scheduler_type: "linear"
warmup_ratio: 0.05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1e-6
weight_decay: 0.05
max_grad_norm: 1.0

# Mixed precision
fp16: true
bf16: false

# Training duration
steps: 200000
skip_steps: 1

# Loss/temperature settings
freeze_tmp: true
tmp_scale: 64

# No hierarchical training for MRL
hierarchical: false
