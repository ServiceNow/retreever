# ImageNet1k retrieval configuration
defaults:
  - model: retreever
  - train: retreever
  - logging: wandb
  - _self_

dataset: "imagenet1k"
data_dir: "/path/to/imagenet1k"
model_type: "retreever"

# Override encoder for images
model:
  encoder_type: "dinov2-large"  # Or resnet50, clip-vit-large-patch14
  encoder_dim: 1024
  tree_depth: 10
  loss_type: "multi_label_contrastive"  # For classification

savedir: "checkpoints/imagenet1k"
